<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>game client</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }
    #canvas {
      border: 1px solid #333;
      background: #0d0d1a;
      display: block;
      cursor: none;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      letter-spacing: 0.05em;
    }
    #status.connected    { color: #1d9e75; }
    #status.disconnected { color: #e24b4a; }
  </style>
</head>
<body>

<!-- Game window dimensions: 1200 (width) x 800 (height). Center = (600, 400) -->
<canvas id="canvas" width="1200" height="800"></canvas>
<div id="status" class="disconnected">disconnected</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const status = document.getElementById('status');

  const COLORS     = ['#5DCAA5', '#85B7EB', '#F0997B', '#ED93B1', '#AFA9EC'];
  const MAX_HEALTH = 100;

  let players    = {};
  let myId       = null;
  let ws         = null;
  let keys       = { w: false, a: false, s: false, d: false };
  let leftClick  = false;
  let mouse      = { x: 0, y: 0 };
  let mouseMoved = false;

  // ── input tracking ────────────────────────────────────────────────────────

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x    = e.clientX - rect.left;
    mouse.y    = e.clientY - rect.top;
    mouseMoved = true;
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) { leftClick = true;  sendInput(); }
  });

  canvas.addEventListener('mouseup', (e) => {
    if (e.button === 0) { leftClick = false; sendInput(); }
  });

  canvas.addEventListener('mouseleave', () => { leftClick = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd'].includes(k) && !keys[k]) {
      keys[k] = true;
      sendInput();
    }
  });

  document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd'].includes(k)) {
      keys[k] = false;
      sendInput();
    }
  });

  // ── network ───────────────────────────────────────────────────────────────

  function sendInput() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({
      type:           'input',
      keys,
      left_click:     leftClick,
      mouse_position: { x: Math.round(mouse.x), y: Math.round(mouse.y) }
    }));
  }

  // send at fixed interval while any input is active
  const SEND_INTERVAL = 50;
  setInterval(() => {
    if (keys.w || keys.a || keys.s || keys.d || leftClick || mouseMoved) {
      sendInput();
      mouseMoved = false;
    }
  }, SEND_INTERVAL);

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      status.textContent = 'connected';
      status.className   = 'connected';
    };

    ws.onclose = () => {
      status.textContent = 'disconnected — retrying...';
      status.className   = 'disconnected';
      setTimeout(connect, 2000);
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'init') {
        myId = msg.id;
      } else if (msg.type === 'state') {
        players = msg.players;
      }
    };
  }

  // ── helpers ───────────────────────────────────────────────────────────────

  function colorForId(id) {
    let hash = 0;
    for (let i = 0; i < id.length; i++) {
      hash = id.charCodeAt(i) + ((hash << 5) - hash);
    }
    return COLORS[Math.abs(hash) % COLORS.length];
  }

  // ── draw helpers ──────────────────────────────────────────────────────────

  function drawGun(px, py, angle, color) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);

    // barrel
    ctx.fillStyle = '#aaaaaa';
    ctx.fillRect(8, -2, 18, 4);

    // body
    ctx.fillStyle = '#888888';
    ctx.fillRect(8, -4, 10, 9);

    ctx.restore();
  }

  function drawHealthBar(px, py, health) {
    const barW = 44;
    const barH = 5;
    const bx   = px - barW / 2;
    const by   = py - 34;
    const pct  = Math.max(0, health) / MAX_HEALTH;

    ctx.fillStyle = '#222222';
    ctx.fillRect(bx, by, barW, barH);

    ctx.fillStyle = pct > 0.5 ? '#1d9e75' : pct > 0.25 ? '#f0a500' : '#e24b4a';
    ctx.fillRect(bx, by, barW * pct, barH);

    ctx.strokeStyle = '#444444';
    ctx.lineWidth   = 0.5;
    ctx.strokeRect(bx, by, barW, barH);
  }

  function drawDeadX(px, py) {
    const s = 11;
    ctx.strokeStyle = '#e24b4a';
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';

    ctx.beginPath();
    ctx.moveTo(px - s, py - s);
    ctx.lineTo(px + s, py + s);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(px + s, py - s);
    ctx.lineTo(px - s, py + s);
    ctx.stroke();
  }

  function drawCrosshair() {
    const gap = 4;
    const len = 9;
    ctx.strokeStyle = 'rgba(255,255,255,0.88)';
    ctx.lineWidth   = 1.2;
    ctx.lineCap     = 'butt';

    ctx.beginPath(); ctx.moveTo(mouse.x - gap - len, mouse.y); ctx.lineTo(mouse.x - gap, mouse.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x + gap, mouse.y);       ctx.lineTo(mouse.x + gap + len, mouse.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y - gap - len); ctx.lineTo(mouse.x, mouse.y - gap); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mouse.x, mouse.y + gap);       ctx.lineTo(mouse.x, mouse.y + gap + len); ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── main draw loop ────────────────────────────────────────────────────────

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth   = 0.5;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    for (const [id, p] of Object.entries(players)) {
      const color  = colorForId(id);
      const isMe   = id === myId;
      const health = p.health !== undefined ? p.health : MAX_HEALTH;
      const isDead = health <= 0;

      // gun direction: local player uses live cursor; remote players use server-broadcast angle
      const angle = isMe
        ? Math.atan2(mouse.y - p.y, mouse.x - p.x)
        : (p.angle ?? 0);

      // gun (drawn behind player)
      if (!isDead) {
        drawGun(p.x, p.y, angle, color);
      }

      // player circle
      ctx.beginPath();
      ctx.arc(p.x, p.y, isMe ? 10 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isDead ? '#333' : color;
      ctx.fill();

      // selection ring for local player
      if (isMe) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.strokeStyle = isDead ? '#333' : color;
        ctx.lineWidth   = 1.5;
        ctx.stroke();
      }

      // dead X overlay
      if (isDead) {
        drawDeadX(p.x, p.y);
      }

      // name label
      ctx.fillStyle = '#ffffff99';
      ctx.font      = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(isMe ? 'you' : id.slice(0, 4), p.x, p.y - 20);

      // health bar (only while alive)
      if (!isDead) {
        drawHealthBar(p.x, p.y, health);
      }
    }

    // crosshair always on top
    drawCrosshair();

    requestAnimationFrame(draw);
  }

  connect();
  draw();
</script>

</body>
</html>
